name: relay

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core, dev]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relay
      RELAY_APP_PASSWORD: ${RELAY_APP_PASSWORD:?set RELAY_APP_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d relay']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    profiles: [core, dev]
    ports:
      - '6379:6379'
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  logto:
    image: svhd/logto:latest
    profiles: [core, dev]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/logto
      TRUST_PROXY_HEADER: '1'
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']
    ports:
      - '3001:3001'
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3001 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: minio/minio:latest
    profiles: [core, dev]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6

  # Local mail catcher (dev only). Nothing here ever reaches a real inbox: Mailpit accepts SMTP on
  # 1025 and shows every message in a web UI on 8025. Two things use it —
  #   • the gateway's notification dispatcher (RELAY_SMTP_HOST=localhost, port 1025)
  #   • Logto's email connector, which is what makes email sign-up + verification codes work locally
  # Without it, email sign-up cannot be enabled at all: Logto requires verification for an email
  # identifier, and verification needs a connector that can actually deliver.
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    healthcheck:
      test: ['CMD', 'sh', '-c', 'wget -q --spider http://localhost:8025 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  mockllm:
    profiles: [dev]
    build:
      context: ../../packages/mockllm
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      MOCKLLM_LATENCY_MS: '40'
    depends_on:
      - valkey

  # Web DB browser for local dev. Auto-connects to the relay DB as the superuser (RLS bypassed, so you
  # see every tenant's rows) — a read/write visualizer, no login. Bound to 127.0.0.1 ONLY: it exposes
  # the DB with no auth, so it must never be reachable off this machine. Local dev convenience only.
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: [core, dev]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/relay?sslmode=disable
    ports:
      - '127.0.0.1:8081:8081'
    restart: unless-stopped

  # Web browser for Valkey (Redis-compatible) — see the live rate-limit buckets, exact-response cache,
  # and pub/sub keys. Auto-connects to the valkey service, no login. Bound to 127.0.0.1 only.
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64 # no arm64 image published; runs under emulation on Apple Silicon
    profiles: [core, dev]
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:valkey:6379
    ports:
      - '127.0.0.1:8082:8081'
    restart: unless-stopped

volumes:
  pgdata: {}
  minio: {}
